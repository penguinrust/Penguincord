name: Build Branches

on:
    push:
        branches:
            - "**"
            - "!pr-**"
    workflow_dispatch:
        inputs:
            branch:
                type: choice
                description: "Branch to build and upload"
                options:
                    - main
                    - dev
                    - translation
                default: "dev"

env:
    FORCE_COLOR: true
    GITHUB_TOKEN: ${{ secrets.ETOKEN }}
    REPO: penguinrust/Penguincord
    USERNAME: GitHub-Actions

permissions:
    contents: write

jobs:
    Build:
        name: Build Penguincord
        runs-on: ubuntu-latest
        if: github.repository == 'penguinrust/Penguincord'

        steps:
            - uses: actions/checkout@v6
              with:
                  ref: ${{ github.event.inputs.branch || github.ref }}

            - uses: pnpm/action-setup@v6
              if: github.ref_name != 'bun'

            - name: Use Node.js 24
              if: github.ref_name != 'bun'
              uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: "pnpm"

            - name: Install dependencies
              if: github.ref_name != 'bun'
              run: pnpm install --frozen-lockfile

            - name: Build web
              if: github.ref_name != 'bun'
              run: pnpm buildWebStandalone

            - name: Build
              if: github.ref_name != 'bun'
              run: pnpm buildStandalone

            - name: Generate plugin lists
              if: github.ref_name != 'bun'
              run: |
                  pnpm generatePluginJson dist/plugins.json
                  pnpm generateEquicordPluginJson dist/equicordplugins.json
                  pnpm generatePenguincordPluginJson dist/penguincordplugins.json
                  pnpm generateVencordPluginJson dist/vencordplugins.json
                  pnpm generateDevsList dist/devs.json

            - uses: oven-sh/setup-bun@v2
              if: github.ref_name == 'bun'
              with:
                  bun-version: latest
            - name: Install dependencies
              if: github.ref_name == 'bun'
              run: bun install

            - name: Build web
              if: github.ref_name == 'bun'
              run: bun run buildWebStandalone

            - name: Build
              if: github.ref_name == 'bun'
              run: bun run buildStandalone

            - name: Generate plugin lists
              if: github.ref_name == 'bun'
              run: |
                  bun run generatePluginJson dist/plugins.json
                  bun run generateEquicordPluginJson dist/equicordplugins.json
                  bun run generatePenguincordPluginJson dist/penguincordplugins.json
                  bun run generateVencordPluginJson dist/vencordplugins.json
                  bun run generateDevsList dist/devs.json